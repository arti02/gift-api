spring.application.name=gift-api
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?reWriteBatchedInserts=true&prepareThreshold=0
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.drop-first=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Hibernate streaming configuration for cursor-based processing
# fetch_size: Number of records fetched from DB in one batch (optimizes network roundtrips)
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=false
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

scheduler.expensive.gifts.enabled=false
scheduler.expensive.gifts.cron=0 */1 * * * *

spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=550MB
spring.servlet.multipart.file-size-threshold=2MB

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.leak-detection-threshold=60000
